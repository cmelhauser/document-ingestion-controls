<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="80 0 1600 540">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#365f91"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#17253a}.box{fill:#eaf2fb;stroke:#365f91;stroke-width:3}.decision{fill:#fff5d6;stroke:#9b6b00;stroke-width:3}.review{fill:#fce9ea;stroke:#9a2634;stroke-width:3}.arrow{fill:none;stroke:#365f91;stroke-width:4;marker-end:url(#a)}.small{font-size:24px;font-weight:600}.title{font-size:32px;font-weight:700}.label{font-size:21px;fill:#5b4210}</style>
  <g transform="translate(100 0)">
  <text x="800" y="42" text-anchor="middle" class="title">Technical source-native table-comprehension lifecycle</text>
  <rect class="box" x="35" y="105" width="210" height="90" rx="14"/><text x="140" y="143" text-anchor="middle" class="small">Immutable page</text><text x="140" y="174" text-anchor="middle" class="small">and native text</text>
  <line class="arrow" x1="245" y1="150" x2="300" y2="150"/><rect class="box" x="310" y="105" width="190" height="90" rx="14"/><text x="405" y="143" text-anchor="middle" class="small">Source profile</text><text x="405" y="174" text-anchor="middle" class="small">and headers</text>
  <line class="arrow" x1="500" y1="150" x2="555" y2="150"/><rect class="box" x="565" y="105" width="200" height="90" rx="14"/><text x="665" y="143" text-anchor="middle" class="small">Source rows</text><text x="665" y="174" text-anchor="middle" class="small">with cell evidence</text>
  <line class="arrow" x1="765" y1="150" x2="820" y2="150"/><rect class="box" x="830" y="105" width="190" height="90" rx="14"/><text x="925" y="143" text-anchor="middle" class="small">LLM evidence</text><text x="925" y="174" text-anchor="middle" class="small">audit</text>
  <line class="arrow" x1="1020" y1="150" x2="1070" y2="150"/><polygon class="decision" points="1175,83 1280,150 1175,217 1070,150"/><text x="1175" y="143" text-anchor="middle" class="small">Concern?</text>
  <line class="arrow" x1="1280" y1="150" x2="1310" y2="150"/><rect class="box" x="1320" y="105" width="230" height="90" rx="14"/><text x="1435" y="143" text-anchor="middle" class="small">Exact registry</text><text x="1435" y="174" text-anchor="middle" class="small">mapping</text>
  <path class="arrow" d="M1175 217 L1175 270 L925 270 L925 205"/>
  <line class="arrow" x1="1435" y1="195" x2="1435" y2="270"/><rect class="box" x="1275" y="280" width="280" height="90" rx="14"/><text x="1415" y="318" text-anchor="middle" class="small">Deterministic cell</text><text x="1415" y="349" text-anchor="middle" class="small">reconciliation</text>
  <line class="arrow" x1="1275" y1="325" x2="1190" y2="325"/><rect class="box" x="925" y="280" width="255" height="90" rx="14"/><text x="1052" y="318" text-anchor="middle" class="small">Validation and</text><text x="1052" y="349" text-anchor="middle" class="small">material review cards</text>
  <line class="arrow" x1="925" y1="325" x2="820" y2="325"/><polygon class="decision" points="710,258 820,325 710,392 600,325"/><text x="710" y="318" text-anchor="middle" class="small">Final review</text><text x="710" y="349" text-anchor="middle" class="small">clear?</text>
  <path class="arrow" d="M600 325 L500 325"/><rect class="box" x="270" y="280" width="220" height="90" rx="14"/><text x="380" y="318" text-anchor="middle" class="small">Approved canonical</text><text x="380" y="349" text-anchor="middle" class="small">export</text>
  <path class="arrow" d="M710 392 L710 470 L1012 470 L1012 378"/><rect class="review" x="820" y="430" width="385" height="75" rx="14"/><text x="1012" y="462" text-anchor="middle" class="small">Exception or linked amendment</text><text x="1012" y="490" text-anchor="middle" class="small">then repeat the applicable gate</text>
  </g>
</svg>
