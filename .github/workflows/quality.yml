name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # The advisory runtime matrix costs two full runners. Upstream drift appears
    # on its own schedule, not on the schedule of our pull requests.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Strict quality gate (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - name: Install PDF utilities and dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          # Only poppler is reached from a test or a gating script: pdftotext and
          # pdftoppm. pandoc, ripgrep and the tectonic build chain are used solely
          # by generate_docs.sh and render_docs.sh, which no gating job invokes.
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check
      - name: Run tests, 100% branch coverage, lint, format, and release checks
        run: PYTHON_BIN="$(command -v python)" bash scripts/quality_gate.sh
      # Acceptance ran as a second job that repeated the whole checkout, apt and
      # pip install to reach the same environment, and `needs: quality` meant it
      # waited for the gate anyway. Running it here keeps the strict gate-then-
      # acceptance order -- the step simply does not start if the gate fails --
      # on one runner instead of two.
      - name: Acceptance controls
        run: |
          PYTHON_BIN="$(command -v python)" bash scripts/run_acceptance_packet.sh /tmp/acceptance
          PYTHON_BIN="$(command -v python)" bash scripts/run_operations_acceptance.sh /tmp/operations
          PYTHON_BIN="$(command -v python)" bash scripts/run_mcp_production_acceptance.sh /tmp/mcp-production
          PYTHON_BIN="$(command -v python)" fixtures/public_business_document_stress_corpus/run_validation.sh /tmp/public-corpus

  supply-chain:
    name: Dependency audit (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify the lock file still resolves the declared requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools==7.6.1
          cp requirements.lock requirements.lock.committed
          python -m piptools compile --quiet --generate-hashes \
            --output-file requirements.lock requirements-dev.txt
          diff -u requirements.lock.committed requirements.lock
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --strict --requirement requirements.lock

  runtime-matrix:
    name: Tests on Python ${{ matrix.python-version }}
    # Advisory only, and it never gated anything: run it on main, on the weekly
    # schedule, and on demand -- not on every pull request, where it was two full
    # runners reporting drift that no reviewer was waiting on.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PDF utilities and dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          # Only poppler is reached from a test or a gating script: pdftotext and
          # pdftoppm. pandoc, ripgrep and the tectonic build chain are used solely
          # by generate_docs.sh and render_docs.sh, which no gating job invokes.
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      # Newer runtimes are advisory: they surface upstream drift before it becomes
      # a break. The supported and gating runtime remains Python 3.12.
      - name: Run the test suite
        run: python -m pytest -q
